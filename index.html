<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RGB Neon Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<p>hello</p>
    <!-- Loading Overlay: Dot -> Grows -> Extends Arms into Metallic X -->
    <div id="loader-overlay" aria-hidden="true">
        <svg class="loader-svg" viewBox="0 0 200 200">
            <defs>
                <!-- Brushed Metallic Linear Gradient -->
                <linearGradient id="metallic-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#434857" />
                    <stop offset="22%" stop-color="#d8dee9" />
                    <stop offset="45%" stop-color="#6b7285" />
                    <stop offset="68%" stop-color="#f8fafc" />
                    <stop offset="88%" stop-color="#3b404e" />
                    <stop offset="100%" stop-color="#aeb6c9" />
                </linearGradient>

                <!-- Subtle RGB Rim Highlight -->
                <linearGradient id="rgb-rim" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#00ffd5" />
                    <stop offset="50%" stop-color="#7a00ff" />
                    <stop offset="100%" stop-color="#ff00c8" />
                </linearGradient>

                <!-- Metallic Shine / Glow Filter -->
                <filter id="metal-glow" x="-35%" y="-35%" width="170%" height="170%">
                    <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#00ffd5" flood-opacity="0.45" />
                    <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.85" />
                </filter>
            </defs>

            <g class="x-assembly" filter="url(#metal-glow)">
                <!-- Arm 1: Top-Left to Bottom-Right -->
                <rect class="arm arm-1" x="100" y="100" width="0" height="18" rx="9"
                      transform="translate(0, -9) rotate(45 100 100)"
                      fill="url(#metallic-grad)" stroke="url(#rgb-rim)" stroke-width="1.2" />

                <!-- Arm 2: Bottom-Left to Top-Right -->
                <rect class="arm arm-2" x="100" y="100" width="0" height="18" rx="9"
                      transform="translate(0, -9) rotate(-45 100 100)"
                      fill="url(#metallic-grad)" stroke="url(#rgb-rim)" stroke-width="1.2" />

                <!-- Center Core Dot that grows first and anchors the X -->
                <circle class="center-dot" cx="100" cy="100" r="4"
                        fill="url(#metallic-grad)" stroke="url(#rgb-rim)" stroke-width="1.2" />
            </g>
        </svg>
    </div>

    <div class="rgb-wrapper">
        <div class="calculator">
            <!-- Display Screen -->
            <div class="display-container">
                <div class="previous-operand">0</div>
                <input type="text" class="current-operand" value="0" readonly>
            </div>

            <!-- Keypad Grid -->
            <div class="buttons-grid">
                <button type="button" class="btn btn-clear" data-action="clear">AC</button>
                <button type="button" class="btn btn-operator" data-action="delete">DEL</button>
                <button type="button" class="btn btn-operator" data-value="%">%</button>
                <button type="button" class="btn btn-operator" data-value="/">÷</button>

                <button type="button" class="btn" data-value="7">7</button>
                <button type="button" class="btn" data-value="8">8</button>
                <button type="button" class="btn" data-value="9">9</button>
                <button type="button" class="btn btn-operator" data-value="*">×</button>

                <button type="button" class="btn" data-value="4">4</button>
                <button type="button" class="btn" data-value="5">5</button>
                <button type="button" class="btn" data-value="6">6</button>
                <button type="button" class="btn btn-operator" data-value="-">−</button>

                <button type="button" class="btn" data-value="1">1</button>
                <button type="button" class="btn" data-value="2">2</button>
                <button type="button" class="btn" data-value="3">3</button>
                <button type="button" class="btn btn-operator" data-value="+">+</button>

                <button type="button" class="btn btn-zero" data-value="0">0</button>
                <button type="button" class="btn" data-value=".">.</button>
                <button type="button" class="btn btn-equals" data-action="calculate">=</button>
            </div>
        </div>
    </div>

</body>
                  </html>
